<html th:replace="~{Admin/Adminbase::Layout(~{::main})}">
<body>
<main>

  <div class="admin-page-head">
    <div>
      <div class="eyebrow">Catalogue</div>
      <h1>Edit Product</h1>
      <p>Update the product details and visibility settings.</p>
    </div>
    <a th:href="@{/Admin/ManageProduct}" class="v-btn v-btn-outline">
      <i class="fa-solid fa-arrow-left"></i> Back to Products
    </a>
  </div>

  <div class="admin-form-card">
    <form th:action="@{'/Admin/EditProduct/' + ${product.id}}" method="post" enctype="multipart/form-data">

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-box-open"></i> Product Details</div>
        <div class="form-row-2">
          <div class="v-form-group">
            <label>Product Name</label>
            <input type="text" name="productName" th:value="${product.productName}" required>
          </div>
          <div class="v-form-group">
            <label>Brand Name</label>
            <input type="text" name="brandName" th:value="${product.brandName}" required>
          </div>
        </div>
        <div class="form-row-2">
          <div class="v-form-group">
            <label>Category</label>
            <select name="category" required>
              <option disabled>Select Category</option>
              <option th:each="cate : ${categories}"
                      th:value="${cate.id}"
                      th:selected="${product.category != null and product.category.id == cate.id}"
                      th:text="${cate.categoryName}">
              </option>
            </select>
          </div>
          <div class="v-form-group">
            <label>Gender</label>
            <select name="gender" required>
              <option th:selected="${product.gender == null}" disabled>Select Gender</option>
              <option th:selected="${product.gender == 'Mens'}">Mens</option>
              <option th:selected="${product.gender == 'Womens'}">Womens</option>
              <option th:selected="${product.gender == 'Kids'}">Kids</option>
              <option th:selected="${product.gender == 'Unisex'}">Unisex</option>
            </select>
          </div>
        </div>
        <div class="v-form-group">
          <label>Product Description</label>
          <textarea name="productDescription" required th:text="${product.productDescription}"></textarea>
        </div>
      </div>

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-tags"></i> Pricing</div>
        <div class="form-row-4">
          <div class="v-form-group">
            <label>Cost Price (₹)</label>
            <input type="number" step="0.01" name="costPrice" th:value="${product.costPrice}" required>
          </div>
          <div class="v-form-group">
            <label>Selling Price (₹)</label>
            <input type="number" step="0.01" name="sellingPrice" id="sellingPrice" th:value="${product.sellingPrice}" required>
          </div>
          <div class="v-form-group">
            <label>Discount (%)</label>
            <input type="number" name="discount" id="discount" th:value="${product.discount}">
          </div>
          <div class="v-form-group">
            <label>Final Price (₹)</label>
            <input type="number" step="0.01" id="finalPrice" th:value="${product.finalPrice}" readonly style="opacity:.7;">
          </div>
        </div>
      </div>

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-droplet"></i> Variants</div>
        <div class="form-row-2">
          <div class="v-form-group">
            <label>Available Colors</label>
            <input type="text" name="colors" th:value="${product.colors}" required>
          </div>
          <div class="v-form-group">
            <label>Available Sizes</label>
            <input type="text" name="sizes" th:value="${product.sizes}" required>
          </div>
        </div>
      </div>

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-warehouse"></i> Inventory & Shipping</div>
        <div class="form-row-3">
          <div class="v-form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" th:value="${product.quantity}" required>
          </div>
          <div class="v-form-group">
            <label>Shipping Charge (₹)</label>
            <input type="number" step="0.01" name="shippingCharge" th:value="${product.shippingCharge}">
          </div>
          <div class="v-form-group">
            <label>Delivery Time</label>
            <input type="text" name="deliveryTime" th:value="${product.deliveryTime}" required>
          </div>
        </div>
      </div>

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-camera"></i> Product Images</div>
        <div class="v-form-group">
          <label>Upload New Images</label>
          <input type="file" name="images" multiple accept=".png,.jpg,.jpeg,.webp">
          <div class="hint">Leave empty to keep existing images.</div>
        </div>
        <div class="v-form-group">
          <label>Current Images</label>
          <div class="thumb-row" th:if="${product.productImages != null}">
            <img th:each="image : ${product.productImages}"
                 th:src="@{'/ProductImages/' + ${image}}"
                 alt="Product Image">
          </div>
        </div>
      </div>

      <div class="admin-form-section">
        <div class="admin-form-section-title"><i class="fa-solid fa-cog"></i> Settings</div>
        <div class="form-row-2">
          <div class="v-switch-row">
            <div>
              <input type="checkbox" name="visibility" id="visibility" th:checked="${product.visibility}" />
              <label for="visibility">Product Visible on Store</label>
            </div>
          </div>
          <div class="v-switch-row">
            <div>
              <input type="checkbox" name="returnPolicy" id="returnPolicy" th:checked="${product.returnPolicy}" />
              <label for="returnPolicy">Return Policy Available</label>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:12px;padding-top:8px;">
        <a th:href="@{/Admin/ManageProduct}" class="v-btn v-btn-outline">Cancel</a>
        <button type="submit" class="v-btn v-btn-gold"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
      </div>

    </form>
  </div>

  <script>
    var discount = document.getElementById('discount');
    var sellingPrice = document.getElementById('sellingPrice');
    var finalPrice = document.getElementById('finalPrice');
    function calcFinal() {
      var sp = parseFloat(sellingPrice.value) || 0;
      var d = parseFloat(discount.value) || 0;
      finalPrice.value = (sp - sp * d / 100).toFixed(2);
    }
    if (discount && sellingPrice) {
      discount.addEventListener('input', calcFinal);
      sellingPrice.addEventListener('input', calcFinal);
    }
  </script>

</main>
</body>
</html>
