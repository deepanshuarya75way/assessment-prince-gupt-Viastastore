<html th:replace="~{Admin/Adminbase::Layout(~{::main})}">
<body>
<main>

  <div class="admin-page-head">
    <div>
      <div class="eyebrow">Commerce</div>
      <h1>Manage Users</h1>
      <p>View, filter, and manage registered members.</p>
    </div>
  </div>

  <!-- Filter Chips -->
  <div class="filter-chips">
    <a th:href="@{/Admin/ManageUsers}" class="filter-chip" th:classappend="${param.status == null} ? 'active' : ''">All</a>
    <a th:href="@{ManageUsers(status='Verified')}" class="filter-chip" th:classappend="${param.status != null and param.status[0] == 'Verified'} ? 'active' : ''">Verified</a>
    <a th:href="@{ManageUsers(status='Unverified')}" class="filter-chip" th:classappend="${param.status != null and param.status[0] == 'Unverified'} ? 'active' : ''">Unverified</a>
    <a th:href="@{ManageUsers(status='Disabled')}" class="filter-chip" th:classappend="${param.status != null and param.status[0] == 'Disabled'} ? 'active' : ''">Disabled</a>
  </div>

  <div class="admin-card">
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Status</th>
            <th>Registered</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user, srno : ${users}">
            <td th:text="${srno.count}"></td>
            <td class="strong" th:text="${user.name}"></td>
            <td th:text="${user.gender}"></td>
            <td th:text="${user.contactNo}"></td>
            <td th:text="${user.email}"></td>
            <td>
              <span class="v-badge green"  th:if="${user.status.name() == 'Verified'}">Verified</span>
              <span class="v-badge muted"  th:if="${user.status.name() == 'Unverified'}">Unverified</span>
              <span class="v-badge red"    th:if="${user.status.name() == 'Disabled'}">Disabled</span>
            </td>
            <td th:text="${#temporals.format(user.registerAt, 'dd MMM yyyy, hh:mm a')}"></td>
            <td>
              <a th:href="@{'UpdateUserStatus/' + ${user.id}}" th:if="${user.status.name() == 'Verified'}"
                 class="v-btn v-btn-danger v-btn-sm">Block</a>
              <a th:href="@{'UpdateUserStatus/' + ${user.id}}" th:if="${user.status.name() == 'Disabled'}"
                 class="v-btn v-btn-outline v-btn-sm">Unblock</a>
              <span th:if="${user.status.name() == 'Unverified'}" style="color:var(--muted-dim);font-size:12px;">Not Verified</span>
              <a th:href="@{'/Admin/DeleteUser/' + ${user.id}}" class="v-btn v-btn-danger v-btn-sm"
                 style="margin-left:6px;" onclick="return confirm('Delete this user?')">Delete</a>
            </td>
          </tr>
          <tr th:if="${users == null or users.size() == 0}">
            <td colspan="8" style="text-align:center;color:var(--muted-dim);padding:40px;">No users found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
</body>
</html>
